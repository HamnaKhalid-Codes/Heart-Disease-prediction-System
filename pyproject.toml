[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1.3",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
